<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Blurred Glow Filter -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Border Glow Gradient -->
    <linearGradient id="glowBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051033" />
      <stop offset="50%" stop-color="#0a2166" />
      <stop offset="100%" stop-color="#123d9e" />
    </linearGradient>

    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="45%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <!-- Blurred Colored Border Aura Background -->
  <rect x="6" y="6" width="148" height="148" rx="34" fill="url(#glowBorderGrad)" opacity="0.8" filter="url(#favGlow)" />

  <!-- Pure White Base Housing for Full Visibility -->
  <rect x="8" y="8" width="144" height="144" rx="32" fill="#ffffff" stroke="url(#glowBorderGrad)" stroke-width="3" />

  <!-- Double FF Emblem inside White Background -->
  <g transform="translate(18, 16) scale(0.78)">
    <path d="M 28 14 C 18 14 12 20 12 30 L 12 142 L 38 122 L 38 86 L 68 86 L 82 66 L 38 66 L 38 40 L 106 40 L 124 14 Z" fill="url(#favNavy)" />
    <rect x="132" y="10" width="13" height="13" rx="2" fill="#00e5ff" />
    <rect x="114" y="24" width="13" height="13" rx="2" fill="#00b4d8" />
    <rect x="132" y="27" width="13" height="13" rx="2" fill="#0096ff" />
    <rect x="114" y="41" width="13" height="13" rx="2" fill="#0066ee" />
    <path d="M 52 48 C 66 48 88 45 112 45 C 120 45 125 50 116 63 L 68 63 L 68 85 L 103 85 C 109 85 113 90 106 101 L 68 101 L 68 144 L 43 144 L 43 68 C 43 56 47 48 52 48 Z" fill="url(#favCyan)" />
    <path d="M 43 68 L 68 63 L 68 101 L 43 93 Z" fill="#051b4d" opacity="0.55" />
  </g>
</svg>

